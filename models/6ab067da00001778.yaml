id: gomodel:6ab067da00001778
title: TIP39-PTH2R signaling, keratinocyte differentiation (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-01'
comments:
- Curated with GO AI HUB. Human TIP39 (PTH2) activates PTH2R in keratinocytes, raising
  cytosolic Ca2+ via PLC signaling and promoting keratinocyte differentiation.
- Human TIP39 (PTH2) acting from the extracellular region on PTH2R in epidermal keratinocytes,
  increasing cytosolic Ca2+ from ER stores via a PLC/IP3R-dependent route and promoting
  keratinocyte differentiation (PMID:27000502, PMID:28094886; ligand-receptor activation
  PMID:34353904). Gq, PLC and IP3R isoforms are not identified in the source papers
  (pharmacological inhibitors only) and are therefore not modelled. GO:0005576 used
  because GO:0005615 extracellular space is obsolete (replaced_by GO:0005576).
