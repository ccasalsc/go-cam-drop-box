id: gomodel:6ab067da00001778
title: TIP39-PTH2R signaling, keratinocyte differentiation (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-01'
comments:
- Curated with GO AI HUB. Human TIP39 (PTH2) activates PTH2R in keratinocytes, raising
  cytosolic Ca2+ via PLC signaling and promoting keratinocyte differentiation.
- 'Curator decision: the PTH2R-Gs (GNAS) arm (PMID:34353904, HEK293T/cryo-EM) was
  removed from this model because it has no downstream components and no keratinocyte
  evidence; better captured as standard PTH2R annotations. MEK3 (MAP2K3) and p38delta
  (MAPK13) units occur in keratinocyte (PMID:12080077).'
- Human TIP39 (PTH2) acting from the extracellular region on PTH2R in epidermal keratinocytes,
  increasing cytosolic Ca2+ from ER stores via a PLC/IP3R-dependent route and promoting
  keratinocyte differentiation (PMID:27000502, PMID:28094886; ligand-receptor activation
  PMID:34353904). Gq, PLC and IP3R isoforms are not identified in the source papers
  (pharmacological inhibitors only) and are therefore not modelled. GO:0005576 used
  because GO:0005615 extracellular space is obsolete (replaced_by GO:0005576).
- 'IVL arm added: PTH2R (PLC pathway unit) causally upstream of PKCdelta (IC: TIP39
  raises involucrin via PTH2R, PMID:27000502; calcium-induced involucrin requires
  PKCdelta, PMID:11864971; with GO:0007200) -> HRAS -> MAP3K1 (MEKK1) -> MAP2K3 (MEK3)
  -> MAPK13 (p38delta) -> CEBPA -> IVL, from dominant-negative epistasis in human
  keratinocytes (PMID:12080077, abstract only). Intra-cascade edges are ''causally
  upstream of, positive effect'' because direct mechanisms were not shown; p38delta
  is reported to be activated by MKK6 in vitro (PMID:9218798). HRAS chosen for generic
  dominant-negative Ras. The PTH2R->PKCdelta join is a curator inference, not tested
  for TIP39. KRT14 arm not modelled (no evidence linking Ca2+/PKC to loss of deltaNp63).'
- 'Localization: p38delta (MAPK13) placed in nucleus per PMID:15340077 (p38delta-ERK1/2
  complex relocates to the keratinocyte nucleus in response to PKCdelta; abstract
  only, survival/death context). MEK3 (MAP2K3) placed in cytoplasm with TAS PMID:8622669
  only; no experimental localization found.'
- 'Revision: HRAS -> MAP3K1 and MAP2K3 -> MAPK13 changed to ''directly positively
  regulates'' with has_input. HRAS-GTP binds the MEKK1 kinase domain directly (PMID:7744823;
  mouse MEKK1, hence ISS with MGI:MGI:1346872); MKK3 phosphorylates/activates p38delta
  (IDA PMID:9374491, PMID:9790884). PKCdelta -> HRAS, MAP3K1 -> MAP2K3 (no evidence
  that MEKK1 directly phosphorylates MKK3; MEKK1''s documented substrates are MKK4/7/MEK1)
  and MAPK13 -> CEBPA remain ''causally upstream of, positive effect''.'
