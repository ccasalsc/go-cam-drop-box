id: gomodel:6ab067da00005793
title: lysosomal membrane repair via PS-stimulated ATG2A lipid transfer (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-06'
comments:
- 'Curated with GO AI HUB. Rapid lysosomal membrane repair (PITT pathway, PMID:36071159):
  PI4K2A makes PI4P on damaged lysosomes, the ORP9-ORP11 complex exchanges it for
  ER phosphatidylserine, and lysosomal PS stimulates ATG2A ER-to-lysosome lipid transfer.'
