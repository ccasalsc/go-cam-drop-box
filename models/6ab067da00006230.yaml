id: gomodel:6ab067da00006230
title: Lipid storage via ATG2A-mediated diacylglycerol transfer to DGAT2 on lipid
  droplets (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-08'
comments:
- Curated with GO AI HUB. ATG2A transfers diacylglycerol (DAG) from the ER to lipid
  droplets at ER-lipid droplet contact sites; DAG made by LPIN1 in the ER is converted
  to triacylglycerol by DGAT2 on the lipid droplet, which requires ATG2A transfer
  activity for its lipid droplet localization (PMID:41249819).
