id: gomodel:6ab067da00005862
title: autophagosome assembly via ATG2A phosphatidylserine transfer (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-06'
comments:
- Curated with GO AI HUB. ATG2A transfers phosphatidylserine from the ER (supplied
  by the TMEM41B scramblase) to the phagophore, where ATG9A scrambles it; the TOM70-TOM40
  (TOM complex) recruits ATG2A to the MAM, in autophagosome assembly.
