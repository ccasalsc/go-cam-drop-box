id: gomodel:6ab067da00002140
title: Calcitonin-CTR-Gs/PKA inhibition of osteoclast bone resorption (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-06'
comments:
- '2026-10-05: CALCA hormone activity and CALCR receptor activity placed in adenylate
  cyclase-activating GPCR signaling pathway (GO:0007189) part of negative regulation
  of bone resorption; the PLC-activating GPCR pathway (and its negative regulation
  of ossification parent, left over from the removed S1P arm) was removed from CALCA.
  Evidence: human osteoclast-like cells, CT-sensitive adenylate cyclase (PMID:11014233,
  abstract only); human CTR isoforms stimulate cAMP (PMID:7619207, abstract); wild-type
  human CTR Gs-mediated cAMP with sCT (PMID:28437792, full text); human osteoclasts,
  CT inhibits resorption and db-cAMP mimics it (PMID:17241109, abstract). Caveat:
  PMID:11014233 reports that in human osteoclast-like cells PKC activators, not PKA
  activators, reproduced CT inhibition of resorption.'
- '2026-10-05: PKA effectors added from Kajiya et al. 2003 (PMID:12632184, full text,
  rat resorbing osteoclasts): calcitonin inhibits H+ extrusion by bafilomycin-sensitive
  V-ATPase and amiloride/EIPA-sensitive NHE (NHE-1 immunostained); mimicked by forskolin/db-cAMP,
  blocked by H-89/Rp-cAMPs, not PKC- or Ca2+-dependent; transporter protein levels
  unchanged. Edges PRKACA -causally upstream of, negative effect-> V-ATPase and ->
  SLC9A1 (mechanism, e.g. direct phosphorylation, not shown). V-ATPase enabler is
  the GO complex term GO:0033181 (plasma membrane proton-transporting V-type ATPase
  complex), no subunit specified: the antibody did not identify the a-subunit isoform
  (ComplexPortal IDs not used; TCIRG1/a3 not added because no experimental complex-membership
  annotation exists). Role in bone resorption: IMP PMID:31567691 (human TCIRG1-mutant
  iPSC osteoclasts). V-ATPase MF/location entered as IC (no human direct assay cited).
  Bone-formation arm: Calcr+/- mice have increased bone formation with normal osteoclast
  number (Dacquin et al. 2004, PMID:14970190, full text); CT/aCGRP-/- mice have increased
  bone formation (Hoff et al. 2002, PMID:12488435, abstract only) - consistent with
  existing ISS (MGI:MGI:101950). Background review: Lerner 2006 J Musculoskelet Neuronal
  Interact 6:87-95.'
- '2026-10-06: Evidence copied from production model gomodel:66b5638000001772 (Signaling
  by Calcitonin mediated by CALCA/CT ligand activating CALCR receptor (Human)) onto
  matching edges: PMID:35324283 (CALCA/CALCR enabled by, has input CALCR, has input
  GNAS, part of AC-activating GPCR signaling), PMID:18057382 (CT in extracellular
  region), PMID:17110384 (GNAS enabled by, part of AC-activating GPCR signaling),
  PMID:12135370 (Galphas at plasma membrane; production uses cytoplasmic side of plasma
  membrane). Not copied: PMID:32296767 (adrenomedullin receptors) and PMID:37963465
  (TAAR1) - abstracts do not address CT/CTR; NAS PMID:7588285 (CTR location already
  IDA); ADCY6 step (PMID:17916776, 23842570) not in this model.'
- 'Resorption arm: CALCR directly activates Gs (GNAS; cryo-EM of wild-type human CTR-Galphas-beta1-gamma2,
  PMID:28437792; adenylate cyclase coupling PMID:1331173), causally upstream of PKA
  (PRKACA) in negative regulation of bone resorption. PKA requirement: mouse osteoclast-like
  cells (PMID:8895334), rat osteoclast H+ extrusion (PMID:12632184), human odontoclasts
  (PMID:14691681), entered as IC because no PKA isoform was identified; PRKACA is
  a curator assumption. Adenylyl cyclase isoform unknown (GNAS->PKA ''causally upstream
  of''). Human osteoclast-like cell data (PMID:17535751) used H-7 (PKA+PKC inhibitor),
  partial block. CTR->Galphaq/11 not modelled (overexpression reconstitution only,
  PMID:8732687).'
