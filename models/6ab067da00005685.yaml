id: gomodel:6ab067da00005685
title: Autophagosome assembly via ATG2A lipid transfer (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-06'
comments:
- Curated with GO AI HUB. ATG2A transfers PE from the ER (supplied by the TMEM41B
  scramblase) to the phagophore, where ATG9A scrambles it; WDR45/WIPI4 positively
  regulates ATG2A, in autophagosome assembly.
