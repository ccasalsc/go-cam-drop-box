id: gomodel:6ab067da00006447
title: ATG2A transfers phosphatidylinositol to ATG9A vesicles for PI3P synthesis in
  autophagosome assembly (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-08'
comments:
- Curated with GO AI HUB. ATG2A transfers phosphatidylinositol (PI) from the ER into
  ATG9A compartments, where the PI3KC3-C1 complex converts it to PI3P; PI3P-activated
  WIPI4 and membrane-bound LC3B bind ATG2A and enhance its lipid transfer, a positive
  feedback loop in autophagosome assembly (PMID:42816491).
