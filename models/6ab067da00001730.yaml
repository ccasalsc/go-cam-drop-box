id: gomodel:6ab067da00001730
title: Endocytosis in IAV entry via TRIM62-WASH (Human-IAV)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-09-30'
comments:
- Curated with GO AI HUB. TRIM62 binds the FAM21/WASHC2C head domain and limits WASH-retromer
  coupling, maintaining a retromer-free WASH pool that supports lipid-raft-mediated
  endocytosis of influenza A virus; VPS35 and FAM21 act in the opposite direction.
  From PMID:42763336.
- 'FAM21 identity: WASHC2C (UniProtKB:Q9Y4E1), not the WASHC2A paralogue; the paper''s
  antibody is Invitrogen PA5-35883 (anti-FAM21C).'
- 'Mechanism modelled: VPS35 (retromer) and FAM21/WASHC2C couple the WASH complex
  to the endosomal membrane, restraining the pool of WASH available for lipid-raft-mediated
  viral uptake. TRIM62 binds FAM21 and limits that coupling, maintaining a retromer-free,
  endocytically competent WASH pool. TRIM62 and VPS35 act antagonistically on WASH1
  localisation without changing WASH subunit levels (Appendix S1C, Fig 5F, Appendix
  S2D).'
- 'Not modelled from this paper: TRIM62''s separate post-entry role in NP expression
  (Fig EV2F); the opposing WASH1/VPS35 roles in cholera toxin B uptake (Fig EV3G,H);
  GLUT1 Golgi mis-sorting on TRIM62 knockdown (Appendix S2E); the pro-entry contributions
  of CCDC53, SWIP and Strumpellin (Fig 4, knockdown evidence only); and SFV/vaccinia/VSV
  infection results (Fig EV2G-I). Clathrin-mediated endocytosis is excluded: EGF uptake
  was unaffected and transferrin uptake increased on TRIM62 knockdown (Fig 3A,B);
  macropinocytosis is excluded (dextran uptake unaffected, Fig 3C).'
- 'Source: PMID:42763336 (Gupta K et al., EMBO Rep 2026). Human; A549 lung epithelial
  cells, with HeLa and HEK293T for interaction assays. Virus: influenza A virus X-31
  (H3N2).'
- 'TRIM62 acts here WITHOUT its E3 ubiquitin ligase activity: the RING point mutant
  and the RING deletion both fully rescued IAV M1 uncoating in TRIM62 KO cells (Fig
  EV5D,E), while the PRY-SPRY deletion did not (Fig 6H). No ubiquitin-ligase MF is
  therefore asserted in this model; the activity captured is non-catalytic protein
  sequestering via the PRY-SPRY domain binding the FAM21 head domain (Y2H Fig 6B;
  co-IP mapping Fig 6C,D; MST KD 0.40 uM for full-length TRIM62 and 44.9 uM for the
  isolated PRY-SPRY domain, Fig 6E,F).'
- 'WASHC1 is given the root term molecular_function because the paper excludes its
  canonical activity without identifying a replacement: Arp3/ACTR3 knockdown and CK-666
  had no effect on IAV uptake (Fig 3E); TRIM27 knockdown lowered endosomal actin but
  not IAV endocytosis (Appendix S2G,H); and in TRIM62+VPS35 co-depleted cells viral
  entry was restored while endosomal actin stayed low (Fig EV4I). The authors raise
  a non-canonical scaffolding role as a possibility only, and state it remains an
  open question.'
