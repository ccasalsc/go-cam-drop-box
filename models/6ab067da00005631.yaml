id: gomodel:6ab067da00005631
title: UTS2-induced vascular SMC proliferation via RHOA-ROCK2 (Human)
taxon: NCBITaxon:9606
status: development
date_modified: '2026-10-08'
comments:
- Curated with GO AI HUB. Human UTS2 -> UTS2R -> RHOA -> ROCK2 signaling driving vascular
  smooth muscle cell proliferation (Sauzeau et al. 2001 PMID:11397774); partly transferred
  by ISS from rat model gomodel:6ab067da00005438.
- Human copy by sequence similarity (ISS, GO_REF:0000024, with rat RGD IDs) of rat
  model gomodel:6ab067da00005438. Core paper Sauzeau 2001 PMID:11397774 (rat aortic
  SMC).
- 'RHOA unit: all ISS edges (enabled_by, has_input ROCK2, directly positively regulates
  ROCK2 kinase, part_of pathway, pathway part_of pos. reg. VSMC proliferation, CC
  part_of VSMC) use ISS ECO:0000250, GO_REF:0000024, with rat Rhoa RGD:619921, transferred
  from rat model gomodel:6ab067da00005438 whose experimental evidence is Sauzeau et
  al. 2001 PMID:11397774 (and Leung et al. 1995 PMID:7493923 for RhoA-ROCK2). Direct
  RhoA-ROCK2 mechanism also in Matsui et al. 1996 PMID:8641286.'
